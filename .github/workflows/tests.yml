# ReqFlow's own tests, on every push.
#
# This repository builds a tool for running checks automatically and then had
# nobody running its own. The suites only went green when someone remembered to
# ask them, which is the thing the tool exists to stop happening.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest

    # A suite that hangs should fail and show its output, not sit there for six
    # hours. The first run of this workflow did the second thing, and the only
    # way to find out where it had stopped was to cancel it and read the log.
    timeout-minutes: 15

    strategy:
      # one package failing should not hide whether the others pass, which is
      # the whole reason to know about a break early
      fail-fast: false
      matrix:
        package: [backend, frontend, desktop, cli]

    name: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      # A full install, including the optional dependencies.
      #
      # --omit=optional looks right here: the only thing this repository marks
      # optional is the local model, which no test loads. It is not right. That
      # flag drops every optional dependency in the tree, and two of them are
      # load-bearing — TypeScript's platform binary, and the native binding
      # jest's transformer is built on. Tried here, it did not fail a test; it
      # ran none at all.
      - name: Install
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test
